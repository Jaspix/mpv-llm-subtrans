# Put this file on
#   [Windows] %APPDATA%\mpv\script-opts\llm_subtrans.conf
#   [Linux] ~/.config/mpv/script-opts/llm_subtrans.conf

# All options are optional, except api_key, unless you have
# set OPENAI_API_KEY environment variable.

# OpenAI, OpenRouter, or DeepSeek API key
# Default: read from OPENAI_API_KEY env var
api_key=sk-**********

# Target language
# You can use an ISO code (e.g., es, es-la, en, zh, pt-br, fr, ja) or language name (e.g., Spanish).
# Output subtitle files are named <video>.<lang>.srt (or .ass for ASS subtitles) so external
# source subtitles are NEVER overwritten.
# Default: OS language, or English
#dest_lang=es

# Model name
# For OpenAI: gpt-4o-mini
# For DeepSeek: deepseek-chat
# For OpenRouter: deepseek/deepseek-chat, nvidia/nemotron-3.5-lightning, openai/gpt-4o-mini, anthropic/claude-3.5-haiku
# Default(*): auto-selected or deepseek/deepseek-chat for OpenRouter
#model=gpt-4o-mini

# API endpoint base URL
#   OpenRouter - https://openrouter.ai/api/v1
#   OpenAI     - https://api.openai.com/v1
#   DeepSeek   - https://api.deepseek.com/v1
#   Gemini     - https://generativelanguage.googleapis.com/v1beta/openai
# Default(*): Auto-selected via api_key
#base_url=

# (*) The script auto-detects OpenRouter (sk-or-v1-...), OpenAI, and DeepSeek keys.

# Python path, search on PATH or use absolute path
# Default: py (Windows), python3 (others)
#python_bin=python3

# FFmpeg path, search on PATH or use absolute path
# Default: ffmpeg
#ffmpeg_bin=ffmpeg

# Batch size
# The number of dialogues sent in one translate request.
# Default: 50
#batch_size=50

# Subtitle file saving path
# Translated subtitles are saved as <VIDEO_FILENAME>.<lang>.srt (or .ass) in this directory.
# Default: empty (saved in the same directory as the video file)
# If translation fails, detailed error logs are written to llm_subtrans_error.log
#output_dir=

# Extra prompt
# Custom text appended to the translator prompt
# Default: (empty)
#extra_prompt=Keep slang and idiomatic expressions natural

# Skip environment checking
# Default: no
#skip_env_check=yes

# NOTE: Progressive chunking settings below only apply to .srt subtitles.
# .ass subtitles are translated as a whole file to preserve styles, positioning, and typesetting integrity.

# How far ahead to translate in progressive mode (.srt only)
# Default: 300s (5 minutes)
#pre_translate_seconds=300

# Trigger next chunk when playback gets this close to running out (.srt only)
# Default: 60s
#advance_threshold_seconds=60

# Continuous progressive translation (.srt only)
# If yes, continues translating subsequent chunks immediately in the background
# without waiting for playback to approach the advance threshold.
# Default: no
#continuous_mode=no

# Progressive chunking method (.srt only)
# If yes, chunks match batch_size lines instead of a fixed time duration.
# This avoids boundary gaps during rapid/dense dialogue.
# Default: yes
#chunk_by_batch=yes

# Reasoning effort level (for reasoning-capable models like Nemotron, DeepSeek, GLM, etc.)
# Options: none, low, medium, high
# Default: none
# Set to 'low' for models like Nemotron 3.5 or GLM-5.3-Flash if you want higher nuance
# without running into long 15-minute thinking delays.
#reasoning_effort=none

# OSD message font size
# Controls the size of status and progress messages displayed by this plugin.
# Default: 20 (set to 16 for ~50% of the original 32 size)
#osd_font_size=20


